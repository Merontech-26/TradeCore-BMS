{% load static %}
<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Angalia Email Yako | TradeCore</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            /* Background ya TradeCore (Dots) */
            background-color: #f3f4f6;
            background-image: radial-gradient(#d1d5db 1px, transparent 1px);
            background-size: 24px 24px;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
        }

        .tc-glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 4px solid #C9A227; /* Mstari wa Dhahabu kwa juu */
            box-shadow: 0 24px 60px rgba(39, 20, 68, 0.08);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-5 relative overflow-hidden">
    
    <!-- Rangi za Background (Gradients) kwa mbali -->
    <div class="absolute top-[-10%] left-[-5%] w-96 h-96 bg-purple-500/10 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute bottom-[-10%] right-[-5%] w-96 h-96 bg-amber-500/10 rounded-full blur-3xl pointer-events-none"></div>

    <div class="w-full max-w-md relative z-10 text-center">
        
        <!-- Kadi Yenyewe -->
        <div class="tc-glass-card rounded-[28px] p-10">
            <!-- Icon ya Tiki (Success) -->
            <div class="inline-flex items-center justify-center w-20 h-20 rounded-[22px] bg-gradient-to-br from-[#f0fdf4] to-[#dcfce7] text-emerald-600 shadow-lg mb-6 border border-emerald-200">
                <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            </div>
            
            <h1 class="text-2xl font-black text-gray-900 tracking-tight mb-3">Angalia Email Yako</h1>
            
            <p class="text-sm text-gray-500 font-medium leading-relaxed mb-8">
                Kama akaunti yenye email uliyoweka ipo kwenye mfumo, tumekutumia link ya kutengeneza nenosiri jipya.
            </p>
            
            <a href="{% url 'login' %}" class="inline-flex w-full min-h-[48px] items-center justify-center gap-2 rounded-xl bg-gradient-to-r from-gray-800 to-gray-900 hover:from-gray-900 hover:to-black text-white font-bold text-sm tracking-wide shadow-lg shadow-gray-900/20 transition-all transform hover:-translate-y-0.5">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                <span>Rudi Kwenye Login</span>
            </a>
        </div>

        <p class="text-center text-[10px] text-gray-400 font-medium mt-6 uppercase tracking-widest">
            &copy; 2026 Meron Tech
        </p>
    </div>
</body>
</html>
