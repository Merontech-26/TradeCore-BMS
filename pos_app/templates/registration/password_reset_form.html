{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password | TradeCore</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
html,body,input,button{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Arial,sans-serif}
</style>
</head>
<body class="min-h-screen bg-white flex items-center justify-center p-5">
<main class="w-full max-w-md">
  <div class="text-center mb-7">
    <div class="h-14 mb-3 flex items-center justify-center">
      <img src="{% static 'logo.png' %}" alt="TradeCore" class="h-full w-auto object-contain">
    </div>
    <h1 class="text-2xl font-semibold tracking-tight text-gray-900">Reset your password</h1>
    <p class="mt-2 text-sm text-gray-500 leading-relaxed">Enter the email address linked to your TradeCore account and we'll send you a password reset link.</p>
  </div>
  <form method="post" class="bg-white border border-gray-200 rounded-3xl p-6 shadow-[0_18px_50px_rgba(0,0,0,.08)] space-y-4">
    {% csrf_token %}
    <label for="id_email" class="block text-xs font-semibold text-gray-500 uppercase tracking-widest">Email address</label>
    {{ form.email }}
    <button type="submit" class="w-full min-h-[44px] rounded-2xl bg-[#501b87] hover:bg-[#6421a1] text-white font-semibold flex items-center justify-center">Send reset link</button>
    <a href="{% url 'login' %}" class="block text-center text-sm font-medium text-[#C9A227] hover:underline">Back to login</a>
  </form>
</main>
<script>
const email=document.getElementById('id_email');
if(email){email.className='w-full px-4 py-3 rounded-2xl bg-gray-50 border border-gray-200 outline-none focus:bg-white focus:ring-2 focus:ring-[#501b87]/20'; email.placeholder='you@example.com';}
</script>
</body>
</html>
